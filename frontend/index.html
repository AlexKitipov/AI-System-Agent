<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI System Agent - Manual Test Console</title>
<style>
  body {
    font-family: Consolas, "Courier New", monospace;
    background: #1e1e1e;
    color: #ddd;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 18px; color: #fff; }
  .row { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; color: #9cdcfe; }
  textarea, input {
    width: 100%;
    box-sizing: border-box;
    background: #252526;
    color: #d4d4d4;
    border: 1px solid #444;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
  }
  textarea { height: 160px; resize: vertical; }
  button {
    background: #0e639c;
    color: white;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #1177bb; }
  #log {
    margin-top: 16px;
    background: #111;
    border: 1px solid #333;
    padding: 12px;
    height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 12px;
  }
  .ok { color: #4ec9b0; }
  .err { color: #f48771; }
</style>
</head>
<body>
  <h1>AI System Agent — Manual Test Console</h1>

  <div class="row">
    <label for="gatewayUrl">Gateway URL</label>
    <input id="gatewayUrl" value="http://127.0.0.1:8765/command" />
  </div>

  <div class="row">
    <label for="tokenInput">Token (X-Auth-Token)</label>
    <input id="tokenInput" value="CHANGE_ME_SECRET" />
  </div>

  <div class="row">
    <label for="commandInput">JSON command</label>
    <textarea id="commandInput">{
  "action": "move_mouse",
  "params": { "x": 500, "y": 300 }
}</textarea>
  </div>

  <button id="sendBtn">Send command</button>

  <div id="log"></div>

  <script src="app.js"></script>
</body>
</html>
